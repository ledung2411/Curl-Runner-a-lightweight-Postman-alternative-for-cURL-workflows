name: Python tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]   # 3.10 = phiên bản tối thiểu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install requests charset-normalizer ttkbootstrap
      - name: Run unit tests
        # The GUI smoke test needs a display; it skips itself when Tk is unavailable.
        run: |
          if command -v xvfb-run >/dev/null; then
            xvfb-run -a python -m unittest discover -s tests -v
          else
            python -m unittest discover -s tests -v
          fi
