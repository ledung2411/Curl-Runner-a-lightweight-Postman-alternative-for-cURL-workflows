name: Python tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        # Tests only cover the non-UI modules, so Tk/ttkbootstrap/PyInstaller are not needed.
        run: python -m pip install requests charset-normalizer
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
